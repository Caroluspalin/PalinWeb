<!doctype html>
<html lang="fi"><head><meta charset="utf-8">
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:#e9e9e9;font-family:system-ui,sans-serif;color:#555;
    background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.25) 22px 44px)}
  div{text-align:center;background:#ffffff;padding:28px 40px;border-radius:14px;border:2px dashed #999}
  b{display:block;font-size:44px;color:#111;margin-bottom:8px}
  span{font-size:26px}
</style></head>
<body><div><b id="t"></b><span id="s"></span></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('t');
  document.getElementById('s').textContent = q.get('s');
</script></body></html>
